name: SIB Gestion validation

on:
  push:
    branches: [main, "fix/**", "audit/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  javascript-syntax:
    name: JavaScript syntax and HTML shell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate inline and external JavaScript
        run: node scripts/check-inline-js.mjs
      - name: Test Supabase sign-in failure handling
        run: node scripts/test-supabase-client.mjs
      - name: Test offline service worker cache behavior
        run: node scripts/test-service-worker.mjs
      - name: Test sync conflict safety
        run: node scripts/test-sync-conflict.mjs
      - name: Test shared-state authorization
        run: node scripts/test-shared-state-security.mjs
      - name: Test relational sync schema compatibility
        run: node scripts/test-relational-sync-schema.mjs
