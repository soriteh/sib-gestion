services:
  sib-gestion:
    image: ghcr.io/soriteh/sib-gestion:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    read_only: true
    user: "101:101"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - sib-edge

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      sib-gestion:
        condition: service_healthy
    environment:
      SIB_DOMAIN: ${SIB_DOMAIN:?Définir SIB_DOMAIN dans .env}
      ACME_EMAIL: ${ACME_EMAIL:?Définir ACME_EMAIL dans .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    networks:
      - sib-edge

networks:
  sib-edge:

volumes:
  caddy_data:
  caddy_config:
