worker_processes auto;
pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    server_tokens off;
    client_max_body_size 10m;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), geolocation=(), payment=()" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\\n";
        }

        # Fichiers internes du dépôt : ne jamais les publier via le serveur web.
        location ~* ^/(\\.git|\\.github|supabase|scripts|docs)(/|$) { return 404; }
        location ~* \\.(md|sql|sh|ya?ml|toml|lock)$ { return 404; }
        location ~ /\\. { deny all; }

        # HTML et configuration JS : toujours revalider afin de ne pas garder
        # une ancienne version après une mise à jour de l'application.
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            try_files $uri =404;
        }
        location = /supabase-config.js {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            try_files $uri =404;
        }

        location ~* \\.(?:css|js|svg|webp|png|jpg|jpeg|gif|ico|woff2?)$ {
            add_header Cache-Control "public, max-age=300, must-revalidate" always;
            try_files $uri =404;
        }

        location / {
            add_header Cache-Control "no-store" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
