server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # Nginx runs as an unprivileged user in a read-only container.
    pid /tmp/nginx.pid;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Never cache the application shell, runtime Supabase configuration or push worker.
    location = / {
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location = /supabase-config.js {
        add_header Cache-Control "no-store" always;
    }

    location = /service-worker.js {
        add_header Cache-Control "no-store" always;
        add_header Service-Worker-Allowed "/" always;
    }

    location = /offline-register.js {
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache versioned/static assets for a short period. Revalidation remains possible.
    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|gif|ico|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}
